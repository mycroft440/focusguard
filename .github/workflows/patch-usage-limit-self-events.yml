name: Patch usage limit self events

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/usage-limit-block-editor-fluidity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Skip FocusGuard UI events before accessibility inspection
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt')
          text = path.read_text()
          marker = '''            val directPackage = event.packageName?.toString().orEmpty()

            // An in-flight website transition still consumes browser events, but'''
          replacement = '''            val directPackage = event.packageName?.toString().orEmpty()

            // Events produced by FocusGuard's own Compose UI never need target,
            // browser or Settings inspection. Text fields generate dense focus/text
            // event bursts, so returning here keeps that work off the interaction path.
            // Keep the foreground snapshot accurate so app-limit polling also takes
            // its existing no-measurement fast path while FocusGuard is visible.
            if (directPackage == this@BlockingAccessibilityService.packageName) {
                foregroundPackageName = directPackage
                if (
                    event.eventType == AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED ||
                    event.eventType == AccessibilityEvent.TYPE_WINDOWS_CHANGED
                ) {
                    stopWebsiteTracking()
                }
                return
            }

            // An in-flight website transition still consumes browser events, but'''

          if replacement in text:
              raise SystemExit(0)
          count = text.count(marker)
          if count != 1:
              raise SystemExit(f'expected one accessibility hot-path marker, got {count}')
          path.write_text(text.replace(marker, replacement, 1))
          PY

          if git diff --quiet; then
            exit 0
          fi
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/focusguard/service/BlockingAccessibilityService.kt
          git commit -m 'perf: ignore FocusGuard self accessibility events'
          git push origin HEAD:${{ github.head_ref }}