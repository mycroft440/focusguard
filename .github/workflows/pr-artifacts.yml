name: PR APK and AAB

on:
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-artifacts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-artifacts:
    name: Build test APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK and AAB
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug bundleDebug --no-daemon --stacktrace 2>&1 | tee pr-artifacts-gradle.log

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -type f -name '*.apk' -size +0c | head -n 1)"
          AAB="$(find app/build/outputs/bundle/debug -type f -name '*.aab' -size +0c | head -n 1)"
          test -n "$APK" && test -s "$APK"
          test -n "$AAB" && test -s "$AAB"

          mkdir -p pr-artifacts
          cp "$APK" pr-artifacts/FocusGuard-test.apk
          cp "$AAB" pr-artifacts/FocusGuard-test.aab
          sha256sum \
            pr-artifacts/FocusGuard-test.apk \
            pr-artifacts/FocusGuard-test.aab \
            > pr-artifacts/SHA256SUMS.txt

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-test-apk-${{ github.run_number }}
          path: pr-artifacts/FocusGuard-test.apk
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload test AAB
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-test-aab-${{ github.run_number }}
          path: pr-artifacts/FocusGuard-test.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload checksums and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focusguard-test-build-diagnostics-${{ github.run_number }}
          path: |
            pr-artifacts/SHA256SUMS.txt
            pr-artifacts-gradle.log
          if-no-files-found: warn
          retention-days: 14
