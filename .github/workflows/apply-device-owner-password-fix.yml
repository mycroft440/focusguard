name: Apply Device Owner Password Fix

on:
  push:
    branches: ["fix/block-priority-hierarchy"]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[device-owner-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/block-priority-hierarchy
          fetch-depth: 0

      - name: Apply reviewed runtime patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager = Path("app/src/main/java/com/focusguard/manager/BlockingSessionManager.kt")
          text = manager.read_text(encoding="utf-8")

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one anchor, found {count}")
              return source.replace(old, new, 1)

          helper_anchor = '''            adultFilterEnabled ||
              focusModeActive
          }

          @dagger.hilt.EntryPoint'''
          helper_replacement = '''            adultFilterEnabled ||
              focusModeActive

              /**
               * Device Owner package suspension must not swallow an interactive
               * PASSWORD attempt before Accessibility can present its credential UI.
               * PASSWORD stays launchable only while no stronger protection owns it.
               */
              internal fun packagesForDeviceOwnerSuspension(
                  enforcedPackages: Collection<String>,
                  passwordSessionPackages: Collection<String>,
                  strongerProtectionPackages: Collection<String>,
                  strictPomodoro: Boolean = false
              ): List<String> {
                  val enforced = enforcedPackages.filter(String::isNotBlank).distinct()
                  if (strictPomodoro) return enforced

                  val passwordTargets = passwordSessionPackages
                      .filter(String::isNotBlank)
                      .toSet()
                  if (passwordTargets.isEmpty()) return enforced

                  val strongerTargets = strongerProtectionPackages
                      .filter(String::isNotBlank)
                      .toSet()
                  return enforced.filter { packageName ->
                      packageName !in passwordTargets || packageName in strongerTargets
                  }
              }
          }

          @dagger.hilt.EntryPoint'''
          text = replace_once(text, helper_anchor, helper_replacement, "companion helper")

          session_id_anchor = '''                val enforcingIds = enforcingSessions.map { it.id }
                  val strictPomodoro = enforcingSessions.any {'''
          session_id_replacement = '''                val enforcingIds = enforcingSessions.map { it.id }
                  val passwordSessionIds = enforcingSessions
                      .filter { it.sessionType == "PASSWORD" }
                      .map { it.id }
                  val strongerSessionIds = enforcingSessions
                      .filter { it.sessionType != "PASSWORD" }
                      .map { it.id }
                  val strictPomodoro = enforcingSessions.any {'''
          text = replace_once(text, session_id_anchor, session_id_replacement, "session ids")

          session_apps_anchor = '''                val sessionSites = getSitesForSessions(enforcingIds)

                  val activeAppLimits'''
          session_apps_replacement = '''                val sessionSites = getSitesForSessions(enforcingIds)
                  val passwordSessionApps = getAppsForSessions(passwordSessionIds)
                  val strongerSessionApps = if (strictPomodoro) {
                      sessionApps
                  } else {
                      getAppsForSessions(strongerSessionIds)
                  }
                  val strongerSessionSites = getSitesForSessions(strongerSessionIds)

                  val activeAppLimits'''
          text = replace_once(text, session_apps_anchor, session_apps_replacement, "session targets")

          sites_anchor = '''                val sitesToBlock = (sessionSites + limitSites + appFamilySites + adultFilterRules)'''
          sites_replacement = '''                val strongerWebsiteApps = WebsiteBlocker.appPackageDomainsFor(
                      strongerSessionSites + limitSites + adultFilterRules
                  ).keys.filter(::isPackageInstalled)
                  val sitesToBlock = (sessionSites + limitSites + appFamilySites + adultFilterRules)'''
          text = replace_once(text, sites_anchor, sites_replacement, "stronger website apps")

          suspension_anchor = '''                    focusModeAllowedPackages = focusModeSession?.allowedPackages.orEmpty()
                  ).toList()
                  val nativeFocusLockdownActive = focusModeSession != null &&'''
          suspension_replacement = '''                    focusModeAllowedPackages = focusModeSession?.allowedPackages.orEmpty()
                  ).toList()
                  val deviceOwnerAppsToSuspend = packagesForDeviceOwnerSuspension(
                      enforcedPackages = appsToBlock,
                      passwordSessionPackages = passwordSessionApps,
                      strongerProtectionPackages =
                          strongerSessionApps + limitApps + strongerWebsiteApps + focusModeApps,
                      strictPomodoro = strictPomodoro
                  )
                  val nativeFocusLockdownActive = focusModeSession != null &&'''
          text = replace_once(text, suspension_anchor, suspension_replacement, "device owner suspension")

          sync_anchor = '''                    appsToBlockNow = appsToBlock,
                      allowedSystemApps = appsToBlock.toSet()'''
          sync_replacement = '''                    appsToBlockNow = deviceOwnerAppsToSuspend,
                      allowedSystemApps = deviceOwnerAppsToSuspend.toSet()'''
          text = replace_once(text, sync_anchor, sync_replacement, "sync suspended apps")
          manager.write_text(text, encoding="utf-8")

          tests = Path("app/src/test/java/com/focusguard/manager/BlockingSessionManagerTargetsTest.kt")
          test_text = tests.read_text(encoding="utf-8")
          marker = "device owner keeps password only target launchable for accessibility auth"
          if marker not in test_text:
              suffix = r'''

              @Test
              fun `device owner keeps password only target launchable for accessibility auth`() {
                  assertThat(
                      BlockingSessionManager.packagesForDeviceOwnerSuspension(
                          enforcedPackages = listOf("com.example.password"),
                          passwordSessionPackages = listOf("com.example.password"),
                          strongerProtectionPackages = emptyList()
                      )
                  ).isEmpty()
              }

              @Test
              fun `device owner suspends password target once daily limit becomes stronger`() {
                  assertThat(
                      BlockingSessionManager.packagesForDeviceOwnerSuspension(
                          enforcedPackages = listOf("com.example.password"),
                          passwordSessionPackages = listOf("com.example.password"),
                          strongerProtectionPackages = listOf("com.example.password")
                      )
                  ).containsExactly("com.example.password")
              }

              @Test
              fun `device owner keeps unrelated non password targets suspended`() {
                  assertThat(
                      BlockingSessionManager.packagesForDeviceOwnerSuspension(
                          enforcedPackages = listOf(
                              "com.example.password",
                              "com.example.time"
                          ),
                          passwordSessionPackages = listOf("com.example.password"),
                          strongerProtectionPackages = listOf("com.example.time")
                      )
                  ).containsExactly("com.example.time")
              }

              @Test
              fun `strict pomodoro suspends password target too`() {
                  assertThat(
                      BlockingSessionManager.packagesForDeviceOwnerSuspension(
                          enforcedPackages = listOf(
                              "com.example.password",
                              "com.example.other"
                          ),
                          passwordSessionPackages = listOf("com.example.password"),
                          strongerProtectionPackages = emptyList(),
                          strictPomodoro = true
                      )
                  ).containsExactly(
                      "com.example.password",
                      "com.example.other"
                  ).inOrder()
              }
          '''
              stripped = test_text.rstrip()
              if not stripped.endswith("}"):
                  raise SystemExit("test class closing brace not found")
              test_text = stripped[:-1] + suffix + "\n}\n"
              tests.write_text(test_text, encoding="utf-8")

          plan = Path("implementation_plan.md")
          plan_text = plan.read_text(encoding="utf-8")
          note = '''

          ## Ajuste adicional encontrado na validação
          - Em Device Owner, um alvo PASSWORD não pode permanecer suspenso pelo sistema antes da tentativa de abertura; caso contrário o Accessibility não recebe a janela e a credencial nunca aparece.
          - A suspensão nativa passa a excluir apenas PASSWORD puro. Se o mesmo pacote estiver sob limite efetivamente ativo, TIME/Jejum, Focus Mode ou Pomodoro estrito, ele continua suspenso.
          - O snapshot do Accessibility continua contendo PASSWORD, preservando a interceptação e a autenticação de uma visita.
          '''
          if "## Ajuste adicional encontrado na validação" not in plan_text:
              plan.write_text(plan_text.rstrip() + note + "\n", encoding="utf-8")
          PY

          git diff --check
          git diff -- app/src/main/java/com/focusguard/manager/BlockingSessionManager.kt \
            app/src/test/java/com/focusguard/manager/BlockingSessionManagerTargetsTest.kt \
            implementation_plan.md

      - name: Commit reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "FocusGuard CI"
          git config user.email "actions@github.com"
          git add \
            app/src/main/java/com/focusguard/manager/BlockingSessionManager.kt \
            app/src/test/java/com/focusguard/manager/BlockingSessionManagerTargetsTest.kt \
            implementation_plan.md
          git diff --cached --quiet && exit 0
          git commit -m "fix: keep password targets launchable in device owner [device-owner-fix]"
          git push origin HEAD:fix/block-priority-hierarchy
